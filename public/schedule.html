</script>
<style>
:root {
  --bg: #0f1115;
  --panel: #161a22;
  --text: #e6e6e6;
  --muted: #9aa0aa;
  --accent: #5da9ff;
  --border: #2a2f3a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 24px 16px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
  background: linear-gradient(135deg, var(--bg) 0%, #0a0d10 100%);
  color: var(--text);
  line-height: 1.6;
}

main {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 700;
  margin-bottom: 8px;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

h1 span {
  color: var(--accent);
}

.intro {
  margin-bottom: 32px;
}

.intro-note {
  color: var(--muted);
  font-size: 0.95em;
  line-height: 1.8;
  margin-bottom: 8px;
}

.intro-highlight {
  color: var(--accent);
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  min-width: 120px;
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9em;
  font-weight: 500;
  transition: all 0.3s ease;
}

button:hover {
  border-color: var(--accent);
  color: var(--text);
  background: rgba(93, 169, 255, 0.05);
}

button.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(93, 169, 255, 0.1);
}

.section {
  margin-bottom: 48px;
}

.section-title {
  font-size: 1.5em;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--text);
  letter-spacing: -0.01em;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  transition: all 0.3s ease;
}

.card:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(93, 169, 255, 0.1);
}

.time {
  color: var(--accent);
  font-weight: 600;
  font-size: 0.85em;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.title {
  font-weight: 600;
  font-size: 1.05em;
  margin-bottom: 8px;
  color: var(--text);
}

.desc {
  color: var(--muted);
  font-size: 0.9em;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.week-card {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (max-width: 768px) {
  body {
    padding: 16px;
  }

  h1 {
    font-size: 1.8rem;
  }

  .controls {
    gap: 6px;
  }

  button {
    min-width: 100px;
    padding: 10px 12px;
    font-size: 0.85em;
  }

  .card {
    padding: 14px;
  }
}

</style>
</head>

<body>

<main>
  <section class="intro">
    <h1>My <span>Schedule</span></h1>
    <p class="intro-note">
      A daily system designed to protect the nervous system, circulation and eyes while working 8+ hours at a computer—with space for movement, creativity, relationships and calm.
    </p>
    <p class="intro-note">
      <span class="intro-highlight">Key principle:</span> Breaks = regulation. Blocks = action. <strong>70% execution = success.</strong>
    </p>
  </section>

  <section class="section">
    <div class="controls">
      <button id="btn-base" onclick="setMode('base')" class="active">Standard</button>
      <button id="btn-light" onclick="setMode('light')">Light</button>
      <button id="btn-progress" onclick="setMode('progress')">Progressive</button>
    </div>

    <div id="dayPlan"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Weekly Structure</h2>
    <div id="weekPlan"></div>
  </section>
</main>

<script>

/* ===================== LOGIC ===================== */

const MODE_KEY = "scheduleMode";
let mode = localStorage.getItem(MODE_KEY) || "base";

function setMode(newMode) {
  mode = newMode;
  localStorage.setItem(MODE_KEY, mode);
  render();
}

function render() {
  /* ===== ACTIVE MODE BUTTON ===== */
  document.querySelectorAll(".controls button").forEach(b =>
    b.classList.remove("active")
  );
  document.getElementById("btn-" + mode).classList.add("active");

  /* ===== DAY PLAN ===== */
  const day = document.getElementById("dayPlan");
  day.innerHTML = "";

  DATA.dayPlans[mode].forEach(item => {
    day.innerHTML += `
      <div class="card">
        <div class="time">${item.time}</div>
        <div class="title">${item.title}</div>
        <div class="desc">${item.desc.replace(/\n/g, "<br>")}</div>
      </div>
    `;
  });

  /* ===== WEEK PLAN ===== */
  const week = document.getElementById("weekPlan");
  week.innerHTML = "";

  DATA.weekPlan.forEach(dayItem => {
    week.innerHTML += `
      <div class="card week-card">
        <div class="title">${dayItem.day}</div>
        <div class="desc" style="font-style: italic; color: var(--accent);">${dayItem.theme}</div>

        <div class="desc">
          <strong>Work:</strong><br>
          • ${dayItem.work.focus}<br>
          • Intensity: ${dayItem.work.intensity}<br>
          ${dayItem.work.notes ? "• " + dayItem.work.notes + "<br>" : ""}
        </div>

        <div class="desc">
          <strong>Movement:</strong><br>
          • ${dayItem.movement.type}<br>
          • Time: ${dayItem.movement.duration}<br>
          • Intensity: ${dayItem.movement.intensity}<br>
          ${dayItem.movement.notes ? "• " + dayItem.movement.notes + "<br>" : ""}
        </div>

        <div class="desc">
          <strong>Art:</strong><br>
          • ${dayItem.art.type}<br>
          • Time: ${dayItem.art.duration}<br>
          ${dayItem.art.notes ? "• " + dayItem.art.notes : ""}
        </div>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
